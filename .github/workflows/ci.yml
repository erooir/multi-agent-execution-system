name: Platform checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: hangzhi_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: hangzhi_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hangzhi_ci -d hangzhi_ci_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AGNO_TELEMETRY: "false"
      WORKBENCH_DATA_DIR: /tmp/workbench-ci
      HANGZHI_TEST_POSTGRES_URL: postgresql+psycopg://hangzhi_ci:synthetic-ci-only@127.0.0.1:5432/hangzhi_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - name: Install Python dependencies
        run: uv sync --frozen --python 3.12
      - name: Test backend without paid model calls
        run: uv run pytest -q
      - name: Check Python style
        run: |
          uv run ruff check backend scripts tools/smoke.py
          uv run ruff format --check backend scripts tools/smoke.py
      - name: Check integration schema drift
        run: |
          uv run python -m scripts.export_contracts
          git diff --exit-code -- docs/contracts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run generate:types
          git diff --exit-code -- src/generated
          npm test
          npm run build
      - name: Browser task flow without paid model calls
        env:
          WORKBENCH_DATA_DIR: /tmp/workbench-browser-ci
          HANGZHI_DATABASE_URL: sqlite:////tmp/workbench-browser-ci/platform-v2.sqlite3
          HANGZHI_ADMIN_PASSWORD: synthetic-browser-password
          HANGZHI_SMOKE_PASSWORD: synthetic-browser-password
          HANGZHI_BROWSER_URL: http://127.0.0.1:8100
          HANGZHI_OFFLINE: "true"
        run: |
          mkdir -p .local
          npm --prefix frontend exec -- playwright install --with-deps chromium
          uv run uvicorn backend.app.main:app --host 127.0.0.1 --port 8100 > /tmp/browser-api.log 2>&1 &
          api_pid=$!
          uv run python -m backend.app.platform.worker > /tmp/browser-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" "$api_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8100/api/v2/health > /dev/null; then break; fi
            sleep 1
          done
          npm --prefix frontend run test:browser
