name: Platform checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: hangzhi_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: hangzhi_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hangzhi_ci -d hangzhi_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AGNO_TELEMETRY: "false"
      WORKBENCH_DATA_DIR: /tmp/workbench-ci
      HANGZHI_TEST_POSTGRES_URL: postgresql+psycopg://hangzhi_ci:synthetic-ci-only@127.0.0.1:5432/hangzhi_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - name: Install Python dependencies
        run: uv sync --frozen --python 3.12
      - name: Test backend without paid model calls
        run: uv run pytest -q
      - name: Check Python style
        run: |
          uv run ruff check backend scripts
          uv run ruff format --check backend scripts
      - name: Check integration schema drift
        run: |
          uv run python -m scripts.export_contracts
          git diff --exit-code -- docs/contracts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
