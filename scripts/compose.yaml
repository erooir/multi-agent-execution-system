# Production API + worker use an authorized, separately administered DM8 instance.
# Pre-load the app image with the locked 'dameng' extra. Bootstrap the dedicated
# DM schema once using scripts.dm_database before starting either process.
x-runtime: &runtime
  image: ${HANGZHI_APP_IMAGE:?Set a locally loaded audited application image digest}
  pull_policy: never
  network_mode: host
  environment:
    HANGZHI_REQUIRE_DM: "true"
    HANGZHI_DATABASE_URL: ${HANGZHI_DM_URL:?Set the private dedicated DM8 account URL}
    HANGZHI_OFFLINE: ${HANGZHI_OFFLINE:-false}
    DEEPSEEK_API_KEY_ZX: ${DEEPSEEK_API_KEY_ZX:-}
    HANGZHI_MODEL_PROXY: ${HANGZHI_MODEL_PROXY:-}
    HANGZHI_AUTO_IMPROVE: ${HANGZHI_AUTO_IMPROVE:-false}
    HANGZHI_WORKER_CONCURRENCY: ${HANGZHI_WORKER_CONCURRENCY:-2}
    AGNO_TELEMETRY: "false"
    HF_HUB_OFFLINE: "1"
    PROJ_NETWORK: "OFF"
    HANGZHI_REFERENCE_BATCHES_FILE: /mnt/hangzhi-reference/reference-batches.json
    TESSDATA_PREFIX: /mnt/hangzhi-media/runtime/share/tessdata
    HANGZHI_OCR_LANG: ${HANGZHI_OCR_LANG:-eng+rus}
    HANGZHI_ASR_MODEL_DIR: /mnt/hangzhi-media/models/whisper-base
    HANGZHI_MT_EN_ZH: /mnt/hangzhi-media/translation/translate-en_zh-1_9
    HANGZHI_MT_RU_EN: /mnt/hangzhi-media/translation/translate-ru_en-1_9
    HANGZHI_TESSERACT_PATH: ${HANGZHI_CONTAINER_TESSERACT_PATH:-/usr/bin/tesseract}
    HANGZHI_FFMPEG_PATH: ${HANGZHI_CONTAINER_FFMPEG_PATH:-/usr/bin/ffmpeg}
    HANGZHI_FFPROBE_PATH: ${HANGZHI_CONTAINER_FFPROBE_PATH:-/usr/bin/ffprobe}
  volumes:
    - type: bind
      source: ${HANGZHI_LOCAL_DIR:?Set a dedicated private runtime directory with the original ledger}
      target: /app/.local
      bind: {create_host_path: false}
    - type: bind
      source: ${HANGZHI_REFERENCE_DIR:?Set the private directory containing the operator-verified registry}
      target: /mnt/hangzhi-reference
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${HANGZHI_MEDIA_DIR:?Set the prepared offline media directory, or an existing empty directory for document-only use}
      target: /mnt/hangzhi-media
      read_only: true
      bind: {create_host_path: false}
services:
  api:
    <<: *runtime
  worker:
    <<: *runtime
    command: ["python", "-m", "backend.app.platform.worker"]
