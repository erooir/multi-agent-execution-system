[project]
name = "hangzhi-agent-platform"
version = "2.0.0"
description = "Durable local agent management platform powered by Agno AgentOS"
requires-python = ">=3.12,<3.14"
dependencies = [
  "agno==3.0.10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0",
  "openai>=1.70",
  "httpx>=0.28",
  "python-multipart>=0.0.20",
  "pydantic>=2.10",
  "python-docx>=1.1",
  "pypdf>=5.0",
  "pillow>=11",
  "psycopg[binary]>=3.2,<4",
  "tzdata>=2025.1",
  "mcp>=2.1,<3",
  "rapidocr-onnxruntime==1.4.4",
  "jsonschema>=4.23,<5",
  "fastmcp>=4,<5",
  "ddgs>=9,<10",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
  "pypdfium2>=4,<6",
]

[project.optional-dependencies]
dameng = ["dmPython==2.6.1", "dmSQLAlchemy==2.0.17"]
speech = [
    "faster-whisper>=1.1,<2",
]
language = [
    "ctranslate2>=4.5,<5",
    "sentencepiece>=0.2,<1",
]
vision = [
    "opencv-python-headless>=4.10,<5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
